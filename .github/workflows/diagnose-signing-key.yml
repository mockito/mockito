name: Diagnose signing key

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or third-party actions: only inspect the configured secret.
      - name: Inspect and verify renewed signing key
        shell: bash
        env:
          PGP_KEY: ${{ secrets.PGP_KEY_RENEWED }}
          PGP_PWD: ${{ secrets.PGP_PWD_RENEWED }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import subprocess
          import tempfile

          key = os.environ.pop("PGP_KEY", "")
          password = os.environ.pop("PGP_PWD", "")
          if not key.strip():
              raise SystemExit("PGP_KEY is unavailable to this workflow.")
          if not password:
              raise SystemExit("PGP_PWD is unavailable to this workflow.")

          def run_gpg(home, *args, input=None):
              result = subprocess.run(
                  ["gpg", "--homedir", home, "--batch", "--no-tty", *args],
                  input=input, text=True, capture_output=True,
              )
              if result.returncode:
                  # Never echo GPG output: it may include secret-supplied data.
                  raise SystemExit("GPG key validation failed; raw output suppressed.")
              return result.stdout

          def date(value):
              if not value or value == "0":
                  return "never"
              timestamp = int(value)
              expiry = datetime.datetime.fromtimestamp(timestamp, datetime.timezone.utc)
              state = "expired" if expiry < datetime.datetime.now(datetime.timezone.utc) else "unexpired"
              return f"{expiry:%Y-%m-%d %H:%M:%S} UTC ({state})"

          with tempfile.TemporaryDirectory(prefix="signing-key-", dir=os.environ["RUNNER_TEMP"]) as home:
              try:
                  run_gpg(home, "--import", input=key)
                  del key
                  listing = run_gpg(home, "--with-colons", "--with-fingerprint",
                                    "--with-subkey-fingerprint", "--list-secret-keys")
                  rows = []
                  pending = None
                  for line in listing.splitlines():
                      fields = line.split(":")
                      if fields[0] in ("sec", "ssb"):
                          pending = fields
                      elif fields[0] == "fpr" and pending is not None:
                          fingerprint = fields[9]
                          if not fingerprint or any(c not in "0123456789ABCDEF" for c in fingerprint):
                              raise SystemExit("Unexpected fingerprint format; output suppressed.")
                          marker = pending[14] if len(pending) > 14 else ""
                          availability = {
                              "+": "present locally (not unlocked or tested)",
                              "#": "unavailable (stub)",
                          }.get(marker, "external token or unknown; not confirmed locally")
                          kind = "Primary" if pending[0] == "sec" else "Subkey"
                          status = "revoked" if pending[1] == "r" else "not marked revoked"
                          rows.append(f"| {kind} | `{fingerprint}` | {date(pending[6])} | {availability} | {status} |")
                          pending = None
                  if not rows:
                      raise SystemExit("No secret-key records found in PGP_KEY.")
                  # Sign only a fixed diagnostic message, never a release artifact.
                  # The passphrase is passed over stdin, not through process arguments.
                  fingerprint = "147B691A19097624902F4EA9689CBE64F4BC997F"
                  message = pathlib.Path(home, "validation.txt")
                  signature = pathlib.Path(home, "validation.sig")
                  message.write_text("Mockito renewed signing key validation\n")
                  run_gpg(home, "--pinentry-mode", "loopback", "--passphrase-fd", "0",
                          "--local-user", fingerprint + "!", "--output", str(signature),
                          "--detach-sign", str(message), input=password + "\n")
                  del password
                  run_gpg(home, "--verify", str(signature), str(message))
                  report = "\n".join([
                      "## Signing-key metadata",
                      "",
                      "| Type | Fingerprint | Expiration | Secret material | Status |",
                      "| --- | --- | --- | --- | --- |",
                      *rows,
                      "",
                      "Successfully signed and verified a fixed test message with PGP_KEY_RENEWED and PGP_PWD_RENEWED.",
                      "No release was published and no keys or secrets were changed.",
                      "Compare the primary fingerprint with the affected release's signing key.",
                  ])
                  print(report)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write(report + "\n")
              finally:
                  subprocess.run(["gpgconf", "--homedir", home, "--kill", "all"],
                                 capture_output=True)
          PY
