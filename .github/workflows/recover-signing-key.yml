# Temporary workflow: remove after the signing key has been recovered.
name: Recover signing key (encrypted)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: recover-signing-key
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'mockito/mockito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fixed public recipient; no checkout and no user-controlled recipient input.
      - name: Encrypt signing key for local recovery
        shell: bash
        env:
          PGP_KEY: ${{ secrets.PGP_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          
          RECIPIENT = "5895592F6D8F5634B8F41B9E589AFA5ACB60236E"
          PUBLIC_KEY = """-----BEGIN PGP PUBLIC KEY BLOCK-----
          
          mDMEas0ifRYJKwYBBAHaRw8BAQdArQDNRM/rxFl3vaNGvDDnNxR1eqiOE8sNFA5Q
          ZxSEn1+0HE1vY2tpdG8gc2lnbmluZy1rZXkgcmVjb3ZlcnmImQQTFgoAQRYhBFiV
          WS9tj1Y0uPQbnlia+lrLYCNuBQJqzSJ9AhsDBQkAJ40ABQsJCAcCAiICBhUKCQgL
          AgQWAgMBAh4HAheAAAoJEFia+lrLYCNuACgA/13sdgKEogA491D6/0xPbR4T3KUO
          xpfa5PqZzEFN4BuzAP4vDXNOC9XyGZ1qcw1R7vVJrbJ9gCBW6/zEmJGnATjPDrg4
          BGrNIn0SCisGAQQBl1UBBQEBB0CPq/J5rR6mdJ4ZhmReCob3bjiWQ6uIR30tCoHd
          R5ruBwMBCAeIeAQYFgoAIBYhBFiVWS9tj1Y0uPQbnlia+lrLYCNuBQJqzSJ9AhsM
          AAoJEFia+lrLYCNuSLUBAMth5a2agCWclbTl6xdxVpPDwCFX+rm2h6iGb66uHlFa
          AQCvR/iEfNUVShTW42/xwcgXVZEXcrUGCFQ4Kao28+LhBQ==
          =cv7M
          -----END PGP PUBLIC KEY BLOCK-----
          """
          
          # Remove the signing secret from the environment inherited by subprocesses.
          secret = os.environ.pop("PGP_KEY", "")
          if not secret.strip():
              raise SystemExit("PGP_KEY is unavailable; no artifact created.")
          
          os.umask(0o077)
          output = pathlib.Path(os.environ["RUNNER_TEMP"], "mockito-signing-key.asc.gpg")
          output.unlink(missing_ok=True)
          
          def gpg(home, *args, input=None):
              result = subprocess.run(
                  ["gpg", "--homedir", home, "--batch", "--no-tty", *args],
                  input=input, text=True, capture_output=True,
              )
              if result.returncode:
                  raise RuntimeError("GPG failed")
              return result.stdout
          
          try:
              with tempfile.TemporaryDirectory(prefix="recovery-", dir=os.environ["RUNNER_TEMP"]) as home:
                  try:
                      # Import only the public wrapper key, never the signing key.
                      gpg(home, "--import", input=PUBLIC_KEY)
                      listing = gpg(home, "--with-colons", "--with-fingerprint", "--list-keys")
                      primary_fingerprints = []
                      primary = False
                      for line in listing.splitlines():
                          fields = line.split(":")
                          if fields[0] == "pub":
                              primary = True
                          elif fields[0] == "fpr" and primary:
                              primary_fingerprints.append(fields[9])
                              primary = False
                      if primary_fingerprints != [RECIPIENT]:
                          raise RuntimeError("Unexpected recovery recipient")
                      # Plaintext goes directly from memory to GPG stdin, never to disk or logs.
                      gpg(home, "--trust-model", "always", "--recipient", RECIPIENT,
                          "--output", str(output), "--encrypt", input=secret)
                      del secret
                      if not output.is_file() or output.stat().st_size == 0:
                          raise RuntimeError("Missing encrypted output")
                  finally:
                      subprocess.run(["gpgconf", "--homedir", home, "--kill", "all"],
                                     capture_output=True)
          except Exception:
              output.unlink(missing_ok=True)
              raise SystemExit("Recovery failed; raw diagnostics suppressed and output removed.") from None
          
          print(f"Signing key encrypted to recovery recipient {RECIPIENT}.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  "## Encrypted signing-key recovery\n\n"
                  f"Recipient: `{RECIPIENT}`\n\n"
                  "Download the `mockito-signing-key-encrypted` artifact within one day. "
                  "Decrypt it locally using the recovery private key. "
                  "The artifact contains only ciphertext; PGP_PWD was not accessed.\n"
              )
          PY

      - name: Upload encrypted recovery file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mockito-signing-key-encrypted
          path: ${{ runner.temp }}/mockito-signing-key.asc.gpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove encrypted runner copy
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/mockito-signing-key.asc.gpg"
